<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Поймай перчатку</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">
<style>
  :root{--gold:#e9c46a;--gold2:#b8862f;--ink:#0b0608;--wine:#5a0d1a}
  html,body{margin:0;height:100%;background:#050304;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#f6ead2}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 45%,rgba(0,0,0,.55) 100%)}
  .deco{font-family:"Poiret One","Century Gothic",system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase}
  #hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:max(12px,env(safe-area-inset-top)) 14px 0;pointer-events:none;opacity:0;transition:opacity .4s}
  #hud.on{opacity:1}
  #score{font-size:15px;color:var(--gold);text-shadow:0 1px 6px #000}
  #score b{font-size:26px;font-weight:400}
  #lives{font-size:22px;letter-spacing:4px;color:#e23b54;text-shadow:0 1px 6px #000}
  #lives .off{color:#3b2a2e}
  #toast{position:fixed;left:0;right:0;top:24%;text-align:center;font-size:30px;color:var(--gold);text-shadow:0 2px 14px #000,0 0 22px rgba(233,196,106,.45);pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}
  #toast.on{opacity:1;transform:none}
  .panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,3,4,.55);transition:opacity .4s;z-index:5}
  .panel.hide{opacity:0;pointer-events:none}
  .card{width:min(86vw,360px);padding:26px 22px 22px;text-align:center;background:linear-gradient(180deg,rgba(30,10,14,.94),rgba(12,5,7,.96));border:1px solid var(--gold2);outline:1px solid rgba(233,196,106,.25);outline-offset:5px;border-radius:4px;box-shadow:0 20px 60px #000}
  .card h1{margin:0 0 6px;font-size:34px;font-weight:400;color:var(--gold)}
  .card .sub{font-size:12px;color:#d9c7a4;opacity:.85;margin-bottom:14px}
  .card p{margin:10px 0 18px;font-size:15px;line-height:1.45;color:#eadfca;text-wrap:balance}
  .rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);margin:12px 0}
  button.go{font:inherit;font-size:17px;padding:12px 30px;color:#1a0c06;background:linear-gradient(180deg,#f3d58a,#c9973c);border:0;border-radius:3px;cursor:pointer;box-shadow:0 4px 18px rgba(233,196,106,.25)}
  button.go:active{transform:translateY(1px)}
  #mute{position:fixed;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:9;font-size:15px;background:rgba(0,0,0,.5);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:5px 8px;cursor:pointer}
  #introWrap{position:fixed;inset:0;background:#000;z-index:8;display:none;align-items:center;justify-content:center}
  #introWrap.on{display:flex}
  #intro{width:100%;height:100%;object-fit:contain;background:#000}
  #skip{position:absolute;right:14px;bottom:max(54px,calc(env(safe-area-inset-bottom) + 54px));font-size:13px;padding:9px 16px;color:var(--gold);background:rgba(0,0,0,.55);border:1px solid var(--gold2);border-radius:3px;cursor:pointer}
  #hint{position:fixed;left:0;right:0;bottom:max(46px,calc(env(safe-area-inset-bottom) + 46px));text-align:center;font-size:12px;color:#d9c7a4;opacity:0;transition:opacity .5s;pointer-events:none;text-shadow:0 1px 6px #000}
  #hint.on{opacity:.9}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vig"></div>
<div id="hud"><div id="score" class="deco">Поймано <b id="sc">0</b>/<span id="goal">10</span></div><div id="lives"></div></div>
<div id="toast" class="deco"></div>
<div id="hint" class="deco">Веди пальцем — подставь руку под перчатку</div>

<div id="pStart" class="panel"><div class="card">
  <div class="sub deco">Джаз-клуб · вечернее шоу</div>
  <h1 class="deco">Перчатка</h1>
  <div class="rule"></div>
  <p>Она снимает длинную чёрную перчатку и бросает её со сцены в зал. Поймай десять — и перчатка твоя.</p>
  <button class="go deco" id="bStart">Занять место</button>
</div></div>

<div id="pEnd" class="panel hide"><div class="card">
  <div class="sub deco" id="endSub"></div>
  <h1 class="deco" id="endTitle"></h1>
  <div class="rule"></div>
  <p id="endText"></p>
  <button class="go deco" id="bAgain">Ещё раз</button>
</div></div>

<div id="introWrap"><video id="intro" src="glove-intro.mp4" playsinline webkit-playsinline muted preload="auto"></video><button id="skip" class="deco">Пропустить</button></div>
<audio id="bgm" src="glove-music.mp3" loop preload="auto"></audio>
<button id="mute">🔊</button>

<script>
"use strict";
const tg=(window.Telegram&&Telegram.WebApp)?Telegram.WebApp:null;

const $=id=>document.getElementById(id);

/* ================= мини-движок WebGL ================= */

  trs(p,r,s){const cx=Math.cos(r[0]),sx=Math.sin(r[0]),cy=Math.cos(r[1]),sy=Math.sin(r[1]),cz=Math.cos(r[2]),sz=Math.sin(r[2]);const m=new Float32Array(16);

    o[8]=(a10*b10-a11*b08+a13*b06)*d;o[9]=(a01*b08-a00*b10-a03*b06)*d;o[10]=(a30*b04-a31*b02+a33*b00)*d;o[11]=(a21*b02-a20*b04-a23*b00)*d;
    o[12]=(a11*b07-a10*b09-a12*b06)*d;o[13]=(a00*b09-a01*b07+a02*b06)*d;o[14]=(a31*b01-a30*b03-a32*b00)*d;o[15]=(a20*b03-a21*b01+a22*b00)*d;return o;},
  pt(m,p){const w=m[3]*p[0]+m[7]*p[1]+m[11]*p[2]+m[15];return[(m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12])/w,(m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13])/w,(m[2]*p[0]+m[6]*p[1]+m[10]*p[2]+m[14])/w];}
};
const VS=`attribute vec3 aP;attribute vec3 aN;attribute vec2 aU;uniform mat4 uM,uVP;uniform mat3 uNM;varying vec3 vW,vN,vL;varying vec2 vU;

const FS=`precision mediump float;varying vec3 vW,vN,vL;varying vec2 vU;

function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;}

function mesh(P,N,Uv,I){const m={n:I.length};m.p=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,m.p);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(P),gl.STATIC_DRAW);
  m.nn=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,m.nn);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(N),gl.STATIC_DRAW);
  m.u=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,m.u);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(Uv),gl.STATIC_DRAW);

// тело вращения: prof=[[r,y],...]; smoothN — сглаженные нормали
function lathe(prof,S,smoothN){const P=[],N=[],Uv=[],I=[];
  const ring=(r,y,nr,ny,v)=>{for(let j=0;j<=S;j++){const a=j/S*Math.PI*2,c=Math.cos(a),s=Math.sin(a);P.push(r*c,y,r*s);N.push(nr*c,ny,nr*s);Uv.push(j/S,v);}};
  const segN=i=>{const dr=prof[i+1][0]-prof[i][0],dy=prof[i+1][1]-prof[i][1],l=Math.hypot(dr,dy)||1;return[dy/l,-dr/l];};

    for(let i=0;i<rings-1;i++)for(let j=0;j<S;j++){const a=i*(S+1)+j,b=a+S+1;I.push(a,b,a+1,a+1,b,b+1);}}
  else{for(let i=0;i<prof.length-1;i++){const n=segN(i);ring(prof[i][0],prof[i][1],n[0],n[1],i/(prof.length-1));ring(prof[i+1][0],prof[i+1][1],n[0],n[1],(i+1)/(prof.length-1));

function box(w,hh,d){const x=w/2,y=hh/2,z=d/2,P=[],N=[],Uv=[],I=[];const f=(n,a,b,c,e)=>{const s=P.length/3;[a,b,c,e].forEach((v,k)=>{P.push(...v);N.push(...n);Uv.push(k==1||k==2?1:0,k>1?1:0);});I.push(s,s+1,s+2,s,s+2,s+3);};
  f([0,0,1],[-x,-y,z],[x,-y,z],[x,y,z],[-x,y,z]);f([0,0,-1],[x,-y,-z],[-x,-y,-z],[-x,y,-z],[x,y,-z]);f([1,0,0],[x,-y,z],[x,-y,-z],[x,y,-z],[x,y,z]);f([-1,0,0],[-x,-y,-z],[-x,-y,z],[-x,y,z],[-x,y,-z]);f([0,1,0],[-x,y,z],[x,y,z],[x,y,-z],[-x,y,-z]);f([0,-1,0],[-x,-y,-z],[x,-y,-z],[x,-y,z],[-x,-y,z]);return mesh(P,N,Uv,I);}

function hex(c){return[parseInt(c.slice(1,3),16)/255,parseInt(c.slice(3,5),16)/255,parseInt(c.slice(5,7),16)/255];}
function mat(c,o){return Object.assign({c:hex(c),e:[0,0,0],spec:.15,spark:0,rim:.06,a:1,tex:null,unlit:0,add:0,sheen:0,dim:1},o||{});}
function node(m,mt,pos,rot,scl,parent){const n={mesh:m,mat:mt,pos:pos||[0,0,0],rot:rot||[0,0,0],scl:scl||[1,1,1],kids:[],vis:true,W:M.id()};if(parent)parent.kids.push(n);return n;}

function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function noise(dur,f0,f1,vol){if(muted)return;const a=ac();if(!a)return;const n=a.sampleRate*dur|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.Q.value=.8;f.frequency.setValueAtTime(f0,a.currentTime);f.frequency.exponentialRampToValueAtTime(f1,a.currentTime+dur);
  const g=a.createGain();g.gain.setValueAtTime(.0001,a.currentTime);g.gain.linearRampToValueAtTime(vol,a.currentTime+dur*.3);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);s.connect(f);f.connect(g);g.connect(a.destination);s.start();}
function tone(f,dur,vol,delay,type){if(muted)return;const a=ac();if(!a)return;const t0=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+dur+.02);}
const sfx={whoosh(){noise(.45,500,1800,.12);},catch(){noise(.12,300,150,.25);tone(880,.35,.07,.02);tone(1320,.5,.05,.1);},miss(){tone(196,.5,.09,0,'triangle');tone(147,.6,.08,.15,'triangle');},
  clap(){for(let i=0;i<26;i++)setTimeout(()=>noise(.07,1200,2400,.08),i*70+Math.random()*60);}};

/* ================= анимация артистки ================= */
// поза: L/R = [плечо вперёд(−)/назад(+), отведение в сторону(+), сгиб локтя(−)]
const P_IDLE=t=>{const b=t*4.1;return{L:[-.55+.25*Math.sin(b),.5+.12*Math.sin(b*.5),-1.0+.3*Math.sin(b+1)],R:[.25,.55,-1.75+.08*Math.sin(b)],lean:.02*Math.sin(b*.5),sway:.07*Math.sin(b*.5),turn:.12*Math.sin(b*.25),hy:.07*Math.sin(b*.25+.5),hx:.03*Math.sin(b*.5),hz:-.06*Math.sin(b*.5),bob:.012*Math.abs(Math.sin(b*.5))};};
const KEYS=[ // время, поза
  [.0,null],
  [.38,{L:[-1.3,.12,-.12],R:[-1.15,-.72,-1.25],lean:.06,sway:-.05,turn:-.18,hy:-.2,hx:.1,hz:.08,bob:0}],
  [.95,{L:[-1.3,.12,-.1],R:[-1.2,-.3,-.55],lean:.04,sway:-.03,turn:-.12,hy:-.15,hx:.12,hz:.05,bob:0}],
  [1.4,{L:[-.2,.45,-.5],R:[-2.95,.3,-.75],lean:-.16,sway:.08,turn:.3,hy:-.1,hx:-.08,hz:0,bob:.02}],
  [1.62,{L:[.35,.5,-.3],R:[-1.45,.05,-.12],lean:.2,sway:-.04,turn:-.3,hy:.05,hx:.05,hz:0,bob:0}],
  [2.15,{L:[.1,.45,-.4],R:[-.95,.2,-.35],lean:.08,sway:0,turn:-.1,hy:0,hx:0,hz:.04,bob:0}],
  [2.8,null]];
const mix3=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
function mixPose(a,b,t){const o={};for(const k in a)o[k]=Array.isArray(a[k])?mix3(a[k],b[k],t):lerp(a[k],b[k],t);return o;}
function throwPose(tt,hold,idle){ // hold — пауза на замахе (обманное движение)
  let t=tt;if(t>1.4)t=t<1.4+hold?1.4:t-hold;
  for(let i=0;i<KEYS.length-1;i++){if(t<=KEYS[i+1][0]){const a=KEYS[i][1]||idle,b=KEYS[i+1][1]||idle;let p=mixPose(a,b,smooth((t-KEYS[i][0])/(KEYS[i+1][0]-KEYS[i][0])));
      if(hold&&tt>1.4&&tt<1.4+hold){const w=Math.sin((tt-1.4)/hold*Math.PI);p.R=[p.R[0]+w*.9*Math.sin((tt-1.4)*16),p.R[1],p.R[2]];p.lean+=w*.12;}return p;}}
  return idle;}
function applyPose(p){body.rot=[0,p.turn*.5,p.sway];body.pos[1]=p.bob;torso.rot=[p.lean,p.turn*.6,-p.sway*1.3];head.rot=[p.hx,p.hy,p.hz];
  armL.sh.rot=[p.L[0],0,-p.L[1]];armL.elbow.rot=[p.L[2],0,0];armR.sh.rot=[p.R[0],0,p.R[1]];armR.elbow.rot=[p.R[2],0,0];}
const wpos=n=>[n.W[12],n.W[13],n.W[14]];

/* ================= игра ================= */
const GOAL=10;let best=0;try{best=+localStorage.getItem('gl_best')||0;}catch(e){}
const S={mode:'title',t:0,phase:'wait',pt:0,caught:0,lives:3,hold:0,released:false,stage:3,hx:0,hy:1.2,tx:0,ty:1.2,P0:[0,0,0],v:[0,0,0],acc:[0,0,0],T:1,ft:0,target:[0,0,0],res:'',spin:[0,0],nextDelay:1.2,winT:0,regl:0};
window.S=S;
function hud(){$('sc').textContent=S.caught;$('goal').textContent=GOAL;$('lives').innerHTML='♥'.repeat(S.lives)+'<span class="off">'+'♥'.repeat(3-S.lives)+'</span>';}
let toastTm=0;function toast(s){const e=$('toast');e.textContent=s;e.classList.add('on');clearTimeout(toastTm);toastTm=setTimeout(()=>e.classList.remove('on'),1100);}
function newGame(){S.mode='play';S.caught=0;S.lives=3;S.phase='wait';S.pt=0;S.nextDelay=1.6;S.stage=3;armL.set(3);S.res='';S.tx=0;S.ty=toPlane(0,-.5)[1];glove.root.pos=[0,-50,0];hud();$('hud').classList.add('on');$('hint').classList.add('on');setTimeout(()=>$('hint').classList.remove('on'),5000);}
function startThrow(){S.phase='throw';S.pt=0;S.released=false;S.hold=(S.caught>=4&&Math.random()<.4)?rnd(.45,.9):0;}
function release(){const n=S.caught;S.released=true;S.phase='flight';S.ft=0;
  const P0=wpos(armR.hand);S.P0=P0;const tgt=toPlane(rnd(-.68,.68),rnd(-.72,.02));S.target=tgt;
  const lob=n>=2&&Math.random()<.35;let T=lerp(1.75,1.05,n/(GOAL-1))*(lob?1.25:1)*rnd(.95,1.05);const g=lob?4.6:2.4;
  const ax=(n>=3&&Math.random()<.5)?rnd(1.2,2.4)*(Math.random()<.5?-1:1):0;
  S.acc=[ax,-g,0];S.T=T;S.v=[(tgt[0]-P0[0])/T-.5*ax*T,(tgt[1]-P0[1])/T+.5*g*T,(tgt[2]-P0[2])/T];
  S.spin=[rnd(4,6.5)*(Math.random()<.5?-1:1),rnd(-1.5,1.5)];S.showAt=lerp(0,.42,n/(GOAL-1));sfx.whoosh();haptic();}
function resolve(ok){S.res=ok?'caught':'miss';S.phase='result';S.pt=0;
  if(ok){S.caught++;sfx.catch();haptic('ok');toast(['Поймал!','Браво!','Ловко!','Шарман!','Есть!'][Math.floor(Math.random()*5)]);}
  else{S.lives--;sfx.miss();haptic('bad');toast('Мимо…');}
  hud();}
function endGame(win){S.mode=win?'win':'lose';S.winT=0;if(S.caught>best){best=S.caught;try{localStorage.setItem('gl_best',best);}catch(e){}}
  $('endSub').textContent=win?'Занавес':'Шоу продолжается';$('endTitle').textContent=win?'Перчатка твоя':'Почти!';
  $('endText').textContent=win?'Десять из десяти. Она посылает тебе воздушный поцелуй — и зал аплодирует.':'Поймано перчаток: '+S.caught+' из '+GOAL+'. Лучший результат: '+best+'.';
  if(win)sfx.clap();setTimeout(()=>$('pEnd').classList.remove('hide'),win?2200:900);$('hud').classList.remove('on');}

// управление
function ptr(e){const nx=e.clientX/W*2-1,ny=-((e.clientY-Math.min(70,H*.09))/H*2-1);const p=toPlane(clamp(nx,-.95,.95),clamp(ny,-.95,.6));S.tx=p[0];S.ty=p[1];}
addEventListener('pointerdown',e=>{if(S.mode==='play'){ptr(e);ac();}},{passive:true});
addEventListener('pointermove',e=>{if(S.mode==='play')ptr(e);},{passive:true});
addEventListener('keydown',e=>{if(S.mode!=='play')return;const d=.18;if(e.code==='ArrowLeft')S.tx-=d;if(e.code==='ArrowRight')S.tx+=d;if(e.code==='ArrowUp')S.ty+=d;if(e.code==='ArrowDown')S.ty-=d;});

// вступление: видео с веерами
const iv=$('intro'),iw=$('introWrap');let introDone=true,introGuard=0;
function endIntro(){if(introDone)return;introDone=true;clearTimeout(introGuard);try{iv.pause();}catch(e){}iw.classList.remove('on');newGame();}
function playIntro(){introDone=false;iw.classList.add('on');try{iv.currentTime=0;}catch(e){}const p=iv.play();if(p&&p.catch)p.catch(()=>endIntro());introGuard=setTimeout(()=>{if(iv.readyState<2||iv.currentTime<.05)endIntro();},3500);}
iv.addEventListener('ended',endIntro);iv.addEventListener('error',endIntro);$('skip').addEventListener('click',endIntro);
$('bStart').addEventListener('click',()=>{ac();try{const p=bgm.play();p&&p.catch(()=>{});}catch(e){}$('pStart').classList.add('hide');playIntro();});
$('bAgain').addEventListener('click',()=>{$('pEnd').classList.add('hide');newGame();});

/* ================= кадр ================= */
let last=0,blinkAt=2,time=0;
function frame(now){requestAnimationFrame(frame);if(!last)last=now;const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;S.t+=dt;
  const idle=P_IDLE(time);let pose=idle;const F=faceT;F.smile=.35;F.open=0;F.kiss=0;F.brow=0;F.wink=0;F.look=0;
  let gloveMode='hidden';
  if(S.mode==='play'){S.pt+=dt;
    if(S.phase==='wait'){if(S.pt>S.nextDelay)startThrow();}
    if(S.phase==='throw'||S.phase==='flight'||S.phase==='result'){const tt=S.phase==='throw'?S.pt:S.throwT+(S.phase==='flight'?S.ft:S.T+S.pt);
      if(S.phase==='throw'){S.throwT=S.pt;pose=throwPose(S.pt,S.hold,idle);
        const st=S.pt<.5?3:S.pt<.68?2:S.pt<.86?1:0;if(st!==S.stage){S.stage=st;armL.set(st);}
        if(S.pt>.86)gloveMode='held';F.smile=.55;F.brow=S.pt>1?.7:.2;F.open=S.pt>1.1?.35:0;
        if(S.pt>=1.52+S.hold)release();}
      else pose=throwPose(tt,S.hold,idle);}
    if(S.phase==='flight'){S.ft+=dt;const t=S.ft;const p=[S.P0[0]+S.v[0]*t+.5*S.acc[0]*t*t,S.P0[1]+S.v[1]*t+.5*S.acc[1]*t*t,S.P0[2]+S.v[2]*t];
      glove.root.pos=p;glove.root.rot=[S.spin[0]*t,0,S.spin[1]*t+.4];glove.holder.pos[1]=.32;glove.flap(time,.3);gloveMode='fly';
      F.kiss=t<.7?1:0;F.smile=t<.7?.1:.5;F.brow=.3;F.look=clamp(S.target[0]*1.5,-1,1);
      const k=clamp((t-S.showAt*S.T)/(S.T*(1-S.showAt)),0,1);ring.pos=[S.target[0],S.target[1],ZC];const rs=lerp(1.0,.46,k);ring.scl=[rs,rs,1];ring.mat.a=t>=S.showAt*S.T?lerp(.15,.9,k):0;
      if(t>=S.T){const d=Math.hypot(p[0]-S.hx,p[1]-(S.hy+.05));resolve(d<.3);}}
    else ring.mat.a=Math.max(0,ring.mat.a-dt*4);
    if(S.phase==='result'){
      if(S.res==='caught'){gloveMode='caught';F.smile=1;F.wink=S.pt>.25&&S.pt<.75?1:0;F.open=.25;}
      else{const t=S.T+S.pt;glove.root.pos=[S.P0[0]+S.v[0]*t+.5*S.acc[0]*t*t,S.P0[1]+S.v[1]*t+.5*S.acc[1]*t*t,S.P0[2]+S.v[2]*t];glove.root.rot[0]+=dt*4;gloveMode='fly';F.brow=1;F.open=S.pt<.7?.7:0;F.smile=S.pt<.7?0:.6;}
      if(S.pt>1.25){if(S.caught>=GOAL)endGame(true);else if(S.lives<=0)endGame(false);else{S.phase='reglove';S.pt=0;}}}
    if(S.phase==='reglove'){const k=S.pt/.9;const hide={L:[.75,.25,-.9],R:idle.R,lean:idle.lean,sway:.06,turn:.55,hy:-.35,hx:0,hz:.05,bob:0};
      pose=mixPose(idle,hide,Math.sin(clamp(k,0,1)*Math.PI));if(k>.5&&S.stage!==3){S.stage=3;armL.set(3);}F.smile=.7;F.look=-.6;
      if(k>=1){S.phase='wait';S.pt=0;S.nextDelay=rnd(.5,1.3);}}
  }
  if(S.mode==='win'){S.winT+=dt;gloveMode='caught';const k=smooth(S.winT/.6);pose=mixPose(idle,{L:[-.3,.9,-.3],R:[-1.4+.5*Math.sin(S.winT*3),-.15,-2.1],lean:.1,sway:0,turn:0,hy:0,hx:.05,hz:.06,bob:0},k);F.kiss=(S.winT%2.2)<.9?1:0;F.smile=F.kiss?0:1;F.wink=(S.winT%2.2)>1.2&&(S.winT%2.2)<1.6?1:0;}
  if(S.mode==='lose'){F.smile=.6;F.brow=.4;}
  applyPose(pose);
  // моргание и плавная мимика
  if(time>blinkAt){blinkAt=time+rnd(2.2,4.8);}const bl=blinkAt-time;F.blink=(bl<.13)?1-Math.abs(bl-.065)/.065:0;
  let key='';for(const k in face){face[k]=k==='blink'?F.blink:lerp(face[k],F[k],1-Math.pow(.0005,dt));key+=face[k].toFixed(2);}
  if(key!==faceKey){faceKey=key;drawFace(face);}
  // рука игрока
  const f=1-Math.pow(1e-6,dt);S.hx=lerp(S.hx,S.tx,f);S.hy=lerp(S.hy,S.ty,f);
  if(S.mode==='title'||S.mode==='lose'){S.tx=0;S.ty=toPlane(0,-1.4)[1];}
  pHand.pos=[S.hx,S.hy,ZC];pHand.rot=[.25,0,-S.hx*.35];const curl=(gloveMode==='caught')?1.1:.12;pHand.f.forEach((fg,i)=>{if(i<4)fg.rot[0]=lerp(fg.rot[0],-curl,.25);});
  // мир
  opaque.length=0;blend.length=0;update(root,M.id());
  // перчатка, привязанная к рукам (после расчёта матриц)
  if(gloveMode==='held'){const h2=wpos(armR.hand);glove.root.pos=[h2[0],h2[1]-.05,h2[2]];glove.root.rot=[Math.sin(time*13)*.5-.2,0,Math.cos(time*11)*.45];glove.holder.pos[1]=0;glove.flap(time,.22);}
  else if(gloveMode==='caught'){glove.root.pos=[S.hx,S.hy+.02,ZC+.03];glove.root.rot=[.15,0,Math.sin(time*3)*.12+.25];glove.holder.pos[1]=0;glove.flap(time*.35,.12);}
  else if(gloveMode==='hidden'){glove.root.pos=[0,-50,0];}
  glove.halo.vis=gloveMode==='fly';
  if(gloveMode!=='hidden'){update(glove.root,M.id());} // обновить матрицы (узлы уже в списках)
  // отрисовка
  gl.clearColor(.012,.006,.008,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.disable(gl.BLEND);gl.depthMask(true);
  gl.uniformMatrix4fv(U.uVP,false,VP);gl.uniform3fv(U.uCam,cam);gl.uniform1f(U.uT,time);
  const sp=[.8,6.8,6.2],gp=wpos(torso);let dx=gp[0]-sp[0],dy=gp[1]+.25-sp[1],dz=gp[2]-sp[2];const dl=Math.hypot(dx,dy,dz);gl.uniform3fv(U.uSP,sp);gl.uniform3fv(U.uSD,[dx/dl,dy/dl,dz/dl]);
  const seen=new Set();for(const n of opaque){if(seen.has(n))continue;seen.add(n);drawNode(n);}
  gl.enable(gl.BLEND);gl.depthMask(false);
  for(const n of blend){if(seen.has(n))continue;seen.add(n);if(n.mat.a<=.003)continue;gl.blendFunc(n.mat.add?gl.ONE:gl.SRC_ALPHA,n.mat.add?gl.ONE:gl.ONE_MINUS_SRC_ALPHA);drawNode(n);}
}
armL.set(3);armR.set(3);drawFace(face);hud();requestAnimationFrame(frame);
</script>
</body>
